<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ store_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f8f6f3">
    <div class="admin-login-card">
        <h2>🔒 Admin Login</h2>
        <form onsubmit="adminLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p id="loginError" style="color:red;text-align:center;margin-top:1rem"></p>
    </div>
    <script>
    async function adminLogin(e) {
        e.preventDefault();
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('adminUser').value,
                password: document.getElementById('adminPass').value
            })
        });
        const data = await res.json();
        if (data.success) window.location.href = '/admin';
        else document.getElementById('loginError').textContent = data.error || 'Invalid credentials';
    }
    </script>
</body>
</html>
