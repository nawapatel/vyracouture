{% extends "base.html" %}
{% block title %}Cart - {{ store_name }}{% endblock %}
{% block content %}
<section class="cart-page">
    <div class="container">
        <h1>Shopping Cart</h1>
        <div id="cartContent">
            <div class="cart-loading"><i class="fas fa-spinner fa-spin"></i> Loading cart...</div>
        </div>
    </div>
</section>

<script>
async function loadCart() {
    try {
        const res = await fetch('/api/cart');
        const data = await res.json();
        const container = document.getElementById('cartContent');

        if (!data.items || data.items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-shopping-bag"></i>
                    <h3>Your cart is empty</h3>
                    <p>Looks like you haven't added anything yet!</p>
                    <a href="/shop" class="btn btn-primary">Start Shopping</a>
                </div>`;
            return;
        }

        let html = '<div class="cart-layout"><div class="cart-items">';
        data.items.forEach((item, idx) => {
            const discount = item.original_price > item.price ?
                Math.round((1 - item.price / item.original_price) * 100) : 0;
            html += `
            <div class="cart-item">
                <img src="${item.image || ''}" alt="${item.name}" class="cart-item-img">
                <div class="cart-item-info">
                    <h4>${item.name}</h4>
                    ${item.size ? `<p>Size: ${item.size}</p>` : ''}
                    ${item.color ? `<p>Color: ${item.color}</p>` : ''}
                    <div class="cart-item-price">
                        <span class="sale-price">₹${item.price.toLocaleString('en-IN')}</span>
                        ${item.original_price > item.price ? `<span class="original-price">₹${item.original_price.toLocaleString('en-IN')}</span>` : ''}
                    </div>
                    <div class="cart-item-actions">
                        <div class="qty-controls">
                            <button onclick="updateQty(${idx}, ${item.quantity - 1})">−</button>
                            <span>${item.quantity}</span>
                            <button onclick="updateQty(${idx}, ${item.quantity + 1})">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${idx})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                <div class="cart-item-subtotal">₹${(item.price * item.quantity).toLocaleString('en-IN')}</div>
            </div>`;
        });
        html += '</div>';

        // Summary
        const shipping = data.total >= 999 ? 0 : 99;
        html += `
        <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>₹${data.total.toLocaleString('en-IN')}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : '₹' + shipping}</span></div>
            <hr>
            <div class="summary-row total"><span>Total</span><span>₹${(data.total + shipping).toLocaleString('en-IN')}</span></div>
            <p class="free-shipping-note">${shipping > 0 ? 'Add ₹' + (999 - data.total) + ' more for free shipping!' : '✓ You qualify for free shipping!'}</p>
            <a href="/checkout" class="btn btn-primary btn-lg btn-block">Proceed to Checkout</a>
            <a href="/shop" class="btn btn-outline btn-block">Continue Shopping</a>
        </div></div>`;

        container.innerHTML = html;
    } catch(e) {
        document.getElementById('cartContent').innerHTML = '<p>Error loading cart</p>';
    }
}

async function updateQty(index, quantity) {
    await fetch('/api/cart/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index, quantity})
    });
    loadCart();
    loadCartCount();
}

async function removeItem(index) {
    await fetch('/api/cart/update', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index, quantity: 0})
    });
    loadCart();
    loadCartCount();
    showToast('Item removed from cart');
}

loadCart();
</script>
{% endblock %}
