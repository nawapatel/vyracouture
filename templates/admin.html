<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - {{ store_name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .admin-layout{display:flex;min-height:100vh}
        .admin-sidebar{width:220px;background:#1a1a2e;color:#fff;padding:1rem 0;position:fixed;height:100vh;overflow-y:auto}
        .admin-sidebar h2{padding:1rem 1.5rem;margin:0;border-bottom:1px solid rgba(255,255,255,0.1);font-size:1.1rem}
        .admin-sidebar a{display:flex;align-items:center;gap:10px;padding:0.75rem 1.5rem;color:rgba(255,255,255,0.7);text-decoration:none;transition:all .2s}
        .admin-sidebar a:hover,.admin-sidebar a.active{background:rgba(255,255,255,0.1);color:#fff}
        .admin-main{margin-left:220px;flex:1;padding:2rem;background:#f5f5f5;min-height:100vh}
        .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
        .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
        .stat-card{background:#fff;border-radius:12px;padding:1.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .stat-card h3{font-size:2rem;margin:0;color:#1a1a2e}
        .stat-card p{margin:0.5rem 0 0;color:#666;font-size:0.85rem}
        .admin-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .admin-table th,.admin-table td{padding:0.75rem 1rem;text-align:left;border-bottom:1px solid #eee}
        .admin-table th{background:#f8f9fa;font-weight:600;font-size:0.85rem;text-transform:uppercase;color:#666}
        .admin-table img{width:50px;height:50px;object-fit:cover;border-radius:8px}
        .admin-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
        .badge-pending{background:#fff3cd;color:#856404}.badge-processing{background:#cce5ff;color:#004085}
        .badge-shipped{background:#d1ecf1;color:#0c5460}.badge-delivered{background:#d4edda;color:#155724}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
        .modal-overlay.show{display:flex}
        .modal{background:#fff;border-radius:12px;padding:2rem;max-width:600px;width:90%;max-height:90vh;overflow-y:auto}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .hidden{display:none}
        .upload-zone{border:2px dashed #ccc;border-radius:12px;padding:2rem;text-align:center;cursor:pointer;transition:all .3s;background:#fafafa}
        .upload-zone:hover,.upload-zone.dragover{border-color:#d4536a;background:#f8e8ec}
        .uploaded-images-grid{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.75rem}
        .uploaded-img-wrap{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;border:2px solid #eee}
        .uploaded-img-wrap img{width:100%;height:100%;object-fit:cover}
        .uploaded-img-wrap .remove-img{position:absolute;top:-4px;right:-4px;width:20px;height:20px;background:#dc3545;color:#fff;border:none;border-radius:50%;font-size:0.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
        .upload-progress-item{display:flex;align-items:center;gap:0.5rem;font-size:0.8rem;padding:0.25rem 0}
        .upload-progress-bar{flex:1;height:4px;background:#eee;border-radius:2px;overflow:hidden}
        .upload-progress-bar .fill{height:100%;background:#d4536a;transition:width 0.3s}
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>🛍️ Admin</h2>
            <nav>
                <a href="#" class="active" onclick="showSection('dashboard')"><i class="fas fa-home"></i> Dashboard</a>
                <a href="#" onclick="showSection('products')"><i class="fas fa-box"></i> Products</a>
                <a href="#" onclick="showSection('collections')"><i class="fas fa-layer-group"></i> Collections</a>
                <a href="#" onclick="showSection('orders')"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="#" onclick="showSection('users')"><i class="fas fa-users"></i> Users</a>
            </nav>
            <nav style="border-top:1px solid rgba(255,255,255,0.1);margin-top:auto;padding-top:1rem">
                <a href="/" target="_blank"><i class="fas fa-external-link-alt"></i> View Store</a>
                <a href="#" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="admin-main">
            <!-- Dashboard -->
            <div id="sec-dashboard" class="admin-section">
                <div class="admin-header"><h1>Dashboard</h1></div>
                <div class="stat-cards" id="statCards"></div>
            </div>

            <!-- Products -->
            <div id="sec-products" class="admin-section hidden">
                <div class="admin-toolbar">
                    <h1>Products</h1>
                    <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
                </div>
                <div id="productsTable"></div>
            </div>

            <!-- Collections -->
            <div id="sec-collections" class="admin-section hidden">
                <div class="admin-toolbar">
                    <h1>Collections</h1>
                    <button class="btn btn-primary" onclick="openCollectionModal()"><i class="fas fa-plus"></i> Add Collection</button>
                </div>
                <div id="collectionsTable"></div>
            </div>

            <!-- Orders -->
            <div id="sec-orders" class="admin-section hidden">
                <div class="admin-header"><h1>Orders</h1></div>
                <div id="ordersTable"></div>
            </div>

            <!-- Users -->
            <div id="sec-users" class="admin-section hidden">
                <div class="admin-header"><h1>Users</h1></div>
                <div id="usersTable"></div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
                <h2 id="productModalTitle">Add Product</h2>
                <button onclick="closeModal('productModal')" style="background:none;border:none;font-size:1.5rem;cursor:pointer">&times;</button>
            </div>
            <form onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                <div class="form-group"><label>Name *</label><input type="text" id="pName" required></div>
                <div class="form-group"><label>Description</label><textarea id="pDesc" rows="3"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Sale Price (₹) *</label><input type="number" id="pSalePrice" required></div>
                    <div class="form-group"><label>Original Price (₹) *</label><input type="number" id="pOrigPrice" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Stock</label><input type="number" id="pStock" value="100"></div>
                    <div class="form-group"><label>Fabric</label><input type="text" id="pFabric" placeholder="e.g. Linen"></div>
                </div>
                <div class="form-group">
                    <label>Product Images</label>
                    <!-- Upload Zone -->
                    <div id="uploadZone" class="upload-zone" ondrop="handleDrop(event)" ondragover="event.preventDefault(); this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-cloud-upload-alt" style="font-size:2rem;color:var(--primary);margin-bottom:0.5rem"></i>
                        <p style="margin:0;font-size:0.85rem;font-weight:500">Click or drag images here to upload</p>
                        <p style="margin:0.25rem 0 0;font-size:0.75rem;color:var(--text-muted)">PNG, JPG, GIF, WebP • Max 16MB each</p>
                        <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFileSelect(this.files)">
                    </div>
                    <!-- Upload Progress -->
                    <div id="uploadProgress" style="display:none;margin-top:0.5rem"></div>
                    <!-- Uploaded Images Preview -->
                    <div id="uploadedImages" class="uploaded-images-grid"></div>
                    <!-- Hidden field to store image URLs -->
                    <input type="hidden" id="pImages" value="">
                    <!-- Manual URL input as fallback -->
                    <details style="margin-top:0.5rem">
                        <summary style="font-size:0.8rem;color:var(--text-muted);cursor:pointer">Or paste image URLs manually</summary>
                        <textarea id="pImageUrls" rows="2" placeholder="https://example.com/image.jpg" style="margin-top:0.5rem;width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:0.85rem" onchange="addManualUrls()"></textarea>
                    </details>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Collection</label><select id="pCollection" class="form-select"></select></div>
                    <div class="form-group"><label>Sizes</label><input type="text" id="pSizes" value="XS,S,M,L,XL,XXL" placeholder="XS,S,M,L,XL"></div>
                </div>
                <div class="form-row">
                    <label class="checkbox-label"><input type="checkbox" id="pFeatured"> Featured</label>
                    <label class="checkbox-label"><input type="checkbox" id="pNew" checked> New Arrival</label>
                </div>
                <div class="form-row" style="margin-bottom:1rem">
                    <label class="checkbox-label"><input type="checkbox" id="pSale" checked> On Sale</label>
                    <label class="checkbox-label"><input type="checkbox" id="pActive" checked> Active</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save Product</button>
            </form>
        </div>
    </div>

    <!-- Collection Modal -->
    <div class="modal-overlay" id="collectionModal">
        <div class="modal">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
                <h2>Add Collection</h2>
                <button onclick="closeModal('collectionModal')" style="background:none;border:none;font-size:1.5rem;cursor:pointer">&times;</button>
            </div>
            <form onsubmit="saveCollection(event)">
                <input type="hidden" id="colId">
                <div class="form-group"><label>Name *</label><input type="text" id="colName" required></div>
                <div class="form-group"><label>Description</label><textarea id="colDesc" rows="2"></textarea></div>
                <div class="form-group"><label>Banner Image URL</label><input type="text" id="colBanner"></div>
                <div class="form-group"><label>Sort Order</label><input type="number" id="colSort" value="0"></div>
                <label class="checkbox-label" style="margin-bottom:1rem"><input type="checkbox" id="colActive" checked> Active</label>
                <button type="submit" class="btn btn-primary btn-block">Save Collection</button>
            </form>
        </div>
    </div>

    <script>
    function showSection(name) {
        document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
        document.getElementById('sec-' + name).classList.remove('hidden');
        document.querySelectorAll('.admin-sidebar a').forEach(a => a.classList.remove('active'));
        event.target.closest('a').classList.add('active');
        if (name === 'dashboard') loadStats();
        if (name === 'products') loadAdminProducts();
        if (name === 'collections') loadAdminCollections();
        if (name === 'orders') loadAdminOrders();
        if (name === 'users') loadAdminUsers();
    }

    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    function openModal(id) { document.getElementById(id).classList.add('show'); }

    // Dashboard
    async function loadStats() {
        const res = await fetch('/api/admin/stats');
        if (res.status !== 200) return;
        const s = await res.json();
        document.getElementById('statCards').innerHTML = `
            <div class="stat-card"><h3>${s.total_products}</h3><p>Total Products</p></div>
            <div class="stat-card"><h3>${s.total_orders}</h3><p>Total Orders</p></div>
            <div class="stat-card"><h3>${s.pending_orders}</h3><p>Pending Orders</p></div>
            <div class="stat-card"><h3>${s.total_users}</h3><p>Total Users</p></div>
            <div class="stat-card"><h3>₹${s.total_revenue.toLocaleString('en-IN')}</h3><p>Total Revenue</p></div>
        `;
    }

    // Products
    async function loadAdminProducts() {
        const res = await fetch('/api/admin/products');
        if (res.status !== 200) return;
        const data = await res.json();
        let html = '<table class="admin-table"><thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Collection</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        data.products.forEach(p => {
            html += `<tr>
                <td><img src="${p.image || ''}" alt="${p.name}"></td>
                <td>${p.name}<br><small class="text-muted">${p.collection_slug || ''}</small></td>
                <td>₹${p.sale_price.toLocaleString('en-IN')} <small class="text-muted">/ ₹${p.original_price.toLocaleString('en-IN')}</small></td>
                <td>${p.collection_slug || '-'}</td>
                <td>${p.stock}</td>
                <td>${p.is_active ? '<span style="color:green">Active</span>' : '<span style="color:red">Inactive</span>'}</td>
                <td>
                    <button class="btn btn-sm" onclick="editProduct('${p._id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p._id}')"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('productsTable').innerHTML = html;
        loadCollectionOptions();
    }

    async function loadCollectionOptions() {
        const res = await fetch('/api/admin/collections');
        if (res.status !== 200) return;
        const cols = await res.json();
        document.getElementById('pCollection').innerHTML = '<option value="">None</option>' + cols.map(c => `<option value="${c.slug}">${c.name}</option>`).join('');
    }

    function openProductModal(product) {
        document.getElementById('productId').value = product ? product._id : '';
        document.getElementById('pName').value = product ? product.name : '';
        document.getElementById('pDesc').value = product ? product.description : '';
        document.getElementById('pSalePrice').value = product ? product.sale_price : '';
        document.getElementById('pOrigPrice').value = product ? product.original_price : '';
        document.getElementById('pStock').value = product ? product.stock : 100;
        document.getElementById('pFabric').value = product ? product.fabric : '';
        // Load existing images into upload preview
        uploadedImageUrls = product ? (product.images || []) : [];
        document.getElementById('pImages').value = uploadedImageUrls.join('\n');
        renderUploadedImages();
        document.getElementById('uploadProgress').style.display = 'none';
        document.getElementById('uploadProgress').innerHTML = '';
        document.getElementById('pCollection').value = product ? product.collection_slug : '';
        document.getElementById('pSizes').value = product ? (product.sizes || []).join(',') : 'XS,S,M,L,XL,XXL';
        document.getElementById('pFeatured').checked = product ? product.is_featured : false;
        document.getElementById('pNew').checked = product ? product.is_new : true;
        document.getElementById('pSale').checked = product ? product.is_sale : true;
        document.getElementById('pActive').checked = product ? product.is_active : true;
        document.getElementById('productModalTitle').textContent = product ? 'Edit Product' : 'Add Product';
        openModal('productModal');
    }

    async function editProduct(id) {
        const res = await fetch(`/api/admin/products?page=1`);
        const data = await res.json();
        const product = data.products.find(p => p._id === id);
        // Need full product data
        const fullRes = await fetch(`/api/product/${id}`);
        if (fullRes.ok) {
            const full = await fullRes.json();
            openProductModal(full);
        }
    }

    async function saveProduct(e) {
        e.preventDefault();
        const id = document.getElementById('productId').value;
        const body = {
            name: document.getElementById('pName').value,
            description: document.getElementById('pDesc').value,
            sale_price: parseFloat(document.getElementById('pSalePrice').value),
            original_price: parseFloat(document.getElementById('pOrigPrice').value),
            stock: parseInt(document.getElementById('pStock').value) || 100,
            fabric: document.getElementById('pFabric').value,
            images: document.getElementById('pImages').value.split('\n').filter(u => u.trim()),
            collection_slug: document.getElementById('pCollection').value,
            sizes: document.getElementById('pSizes').value.split(',').map(s => s.trim()).filter(Boolean),
            is_featured: document.getElementById('pFeatured').checked,
            is_new: document.getElementById('pNew').checked,
            is_sale: document.getElementById('pSale').checked,
            is_active: document.getElementById('pActive').checked,
        };

        const url = id ? `/api/admin/product/${id}` : '/api/admin/product';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        if (res.ok) { closeModal('productModal'); loadAdminProducts(); alert('Product saved!'); }
        else alert('Error saving product');
    }

    async function deleteProduct(id) {
        if (!confirm('Delete this product?')) return;
        await fetch(`/api/admin/product/${id}`, {method: 'DELETE'});
        loadAdminProducts();
    }

    // Collections
    async function loadAdminCollections() {
        const res = await fetch('/api/admin/collections');
        if (res.status !== 200) return;
        const cols = await res.json();
        let html = '<table class="admin-table"><thead><tr><th>Name</th><th>Slug</th><th>Products</th><th>Active</th><th>Actions</th></tr></thead><tbody>';
        cols.forEach(c => {
            html += `<tr>
                <td>${c.name}</td><td>${c.slug}</td><td>${c.product_count}</td>
                <td>${c.is_active ? '✅' : '❌'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteCollection('${c._id}')"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('collectionsTable').innerHTML = html;
    }

    function openCollectionModal() {
        document.getElementById('colId').value = '';
        document.getElementById('colName').value = '';
        document.getElementById('colDesc').value = '';
        document.getElementById('colBanner').value = '';
        document.getElementById('colSort').value = '0';
        document.getElementById('colActive').checked = true;
        openModal('collectionModal');
    }

    async function saveCollection(e) {
        e.preventDefault();
        const body = {
            name: document.getElementById('colName').value,
            description: document.getElementById('colDesc').value,
            banner_image: document.getElementById('colBanner').value,
            sort_order: parseInt(document.getElementById('colSort').value) || 0,
            is_active: document.getElementById('colActive').checked,
        };
        const res = await fetch('/api/admin/collection', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        if (res.ok) { closeModal('collectionModal'); loadAdminCollections(); alert('Collection saved!'); }
    }

    async function deleteCollection(id) {
        if (!confirm('Delete this collection?')) return;
        await fetch(`/api/admin/collection/${id}`, {method: 'DELETE'});
        loadAdminCollections();
    }

    // Orders
    async function loadAdminOrders() {
        const res = await fetch('/api/admin/orders');
        if (res.status !== 200) return;
        const orders = await res.json();
        let html = '<table class="admin-table"><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
        orders.forEach(o => {
            const items = o.items.map(i => `${i.name}×${i.quantity}`).join(', ');
            html += `<tr>
                <td><strong>${o.order_id}</strong></td>
                <td>${o.user_name}<br><small>${o.phone}</small></td>
                <td>${items}</td>
                <td>₹${o.total.toLocaleString('en-IN')}</td>
                <td><select onchange="updateOrderStatus('${o._id}', this.value)" class="status-select badge-${o.status}">
                    <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                    <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
                    <option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option>
                    <option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option>
                    <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
                </select></td>
                <td>${o.created_at ? new Date(o.created_at).toLocaleDateString('en-IN') : '-'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="updateOrderStatus('${o._id}','cancelled')"><i class="fas fa-times"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('ordersTable').innerHTML = html;
    }

    async function updateOrderStatus(id, status) {
        await fetch(`/api/admin/order/${id}/status`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})});
        loadAdminOrders();
    }

    // Users
    async function loadAdminUsers() {
        const res = await fetch('/api/admin/users');
        if (res.status !== 200) return;
        const users = await res.json();
        let html = '<table class="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Joined</th><th>Actions</th></tr></thead><tbody>';
        users.forEach(u => {
            html += `<tr>
                <td>${u.name || 'Unknown'}</td>
                <td>${u.phone || '-'}</td>
                <td>${u.email || '-'}</td>
                <td>${u.created_at ? new Date(u.created_at).toLocaleDateString('en-IN') : '-'}</td>
                <td><button class="btn btn-sm btn-danger" onclick="deleteUser('${u._id}')"><i class="fas fa-trash"></i></button></td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('usersTable').innerHTML = html;
    }

    async function deleteUser(id) {
        if (!confirm('Delete this user?')) return;
        await fetch(`/api/admin/user/${id}`, {method: 'DELETE'});
        loadAdminUsers();
    }

    async function adminLogout() {
        await fetch('/api/admin/logout', {method: 'POST'});
        window.location.reload();
    }

    // ─── Image Upload ───────────────────────────────────────
    let uploadedImageUrls = [];

    async function handleFileSelect(files) {
        for (const file of files) {
            await uploadFile(file);
        }
    }

    function handleDrop(e) {
        e.preventDefault();
        e.currentTarget.classList.remove('dragover');
        handleFileSelect(e.dataTransfer.files);
    }

    async function uploadFile(file) {
        if (!file.type.startsWith('image/')) return;

        const progress = document.getElementById('uploadProgress');
        const filename = file.name;
        progress.style.display = 'block';
        progress.innerHTML += `<div class="upload-progress-item" id="prog-${filename.replace(/\./g,'_')}">
            <span>${filename.substring(0,25)}</span>
            <div class="upload-progress-bar"><div class="fill" style="width:0%"></div></div>
            <span class="pct">0%</span></div>`;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload');

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    const el = document.getElementById('prog-' + filename.replace(/\./g,'_'));
                    if (el) {
                        el.querySelector('.fill').style.width = pct + '%';
                        el.querySelector('.pct').textContent = pct + '%';
                    }
                }
            };

            xhr.onload = function() {
                const data = JSON.parse(xhr.responseText);
                const el = document.getElementById('prog-' + filename.replace(/\./g,'_'));
                if (el) el.remove();
                if (progress.children.length === 0) progress.style.display = 'none';

                if (data.success) {
                    uploadedImageUrls.push(data.url);
                    renderUploadedImages();
                    syncImageField();
                }
            };

            xhr.onerror = function() {
                const el = document.getElementById('prog-' + filename.replace(/\./g,'_'));
                if (el) el.remove();
                if (progress.children.length === 0) progress.style.display = 'none';
                alert('Upload failed for: ' + filename);
            };

            xhr.send(formData);
        } catch(e) {
            alert('Upload error: ' + e.message);
        }
    }

    function renderUploadedImages() {
        const container = document.getElementById('uploadedImages');
        container.innerHTML = uploadedImageUrls.map((url, idx) => `
            <div class="uploaded-img-wrap">
                <img src="${url}" alt="Uploaded">
                <button class="remove-img" onclick="removeUploadedImage(${idx})">×</button>
            </div>
        `).join('');
    }

    function removeUploadedImage(idx) {
        uploadedImageUrls.splice(idx, 1);
        renderUploadedImages();
        syncImageField();
    }

    function syncImageField() {
        document.getElementById('pImages').value = uploadedImageUrls.join('\n');
    }

    function addManualUrls() {
        const textarea = document.getElementById('pImageUrls');
        const urls = textarea.value.split('\n').map(u => u.trim()).filter(u => u);
        urls.forEach(url => {
            if (!uploadedImageUrls.includes(url)) uploadedImageUrls.push(url);
        });
        renderUploadedImages();
        syncImageField();
        textarea.value = '';
    }

    // Init
    loadStats();
    </script>
</body>
</html>
