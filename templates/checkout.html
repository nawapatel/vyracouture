{% extends "base.html" %}
{% block title %}Checkout - {{ store_name }}{% endblock %}
{% block content %}
<section class="checkout-page">
    <div class="container">
        <h1>Checkout</h1>
        <div class="checkout-layout">
            <form id="checkoutForm" class="checkout-form" onsubmit="placeOrder(event)">
                <h3>Shipping Details</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="phone" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label>Address *</label>
                    <textarea id="address" rows="3" required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>State *</label>
                        <input type="text" id="state" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Pincode *</label>
                    <input type="text" id="pincode" maxlength="6" required>
                </div>

                <h3>Payment Method</h3>
                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="payment" value="cod" checked>
                        <span><i class="fas fa-money-bill"></i> Cash on Delivery</span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment" value="upi">
                        <span><i class="fas fa-mobile-alt"></i> UPI / Google Pay</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block" id="placeOrderBtn">
                    Place Order
                </button>
            </form>

            <div class="checkout-summary" id="checkoutSummary">
                <div class="cart-loading"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        </div>
    </div>
</section>

<script>
async function loadCheckoutSummary() {
    const res = await fetch('/api/cart');
    const data = await res.json();
    const container = document.getElementById('checkoutSummary');

    let html = '<h3>Order Summary</h3><div class="checkout-items">';
    data.items.forEach(item => {
        html += `
        <div class="checkout-item">
            <img src="${item.image || ''}" alt="${item.name}">
            <div>
                <p>${item.name}</p>
                <p class="small">Size: ${item.size || '-'} × ${item.quantity}</p>
            </div>
            <span>₹${(item.price * item.quantity).toLocaleString('en-IN')}</span>
        </div>`;
    });

    const shipping = data.total >= 999 ? 0 : 99;
    html += `
    </div>
    <div class="summary-row"><span>Subtotal</span><span>₹${data.total.toLocaleString('en-IN')}</span></div>
    <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : '₹' + shipping}</span></div>
    <hr>
    <div class="summary-row total"><span>Total</span><span>₹${(data.total + shipping).toLocaleString('en-IN')}</span></div>`;

    container.innerHTML = html;
}

async function placeOrder(e) {
    e.preventDefault();
    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true;
    btn.textContent = 'Placing order...';

    try {
        const res = await fetch('/api/checkout', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                pincode: document.getElementById('pincode').value,
                phone: document.getElementById('phone').value,
                payment_method: document.querySelector('input[name="payment"]:checked').value
            })
        });
        const data = await res.json();
        if (data.success) {
            window.location.href = `/order-confirmation/${data.order_id}`;
        } else {
            showToast(data.error || 'Failed to place order', 'error');
            btn.disabled = false;
            btn.textContent = 'Place Order';
        }
    } catch(e) {
        showToast('Error placing order', 'error');
        btn.disabled = false;
        btn.textContent = 'Place Order';
    }
}

loadCheckoutSummary();
</script>
{% endblock %}
